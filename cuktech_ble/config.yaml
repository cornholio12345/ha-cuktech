name: "CUKTECH BLE Server"
version: "0.3.0"
slug: "cuktech_ble"
description: "Local CUKTECH 10 Ultra BLE bridge for Home Assistant"
arch:
  - amd64
startup: application
boot: auto
init: false
host_dbus: true
services:
